services:
  app:
    build:
      context: .
      target: app
    container_name: corebank-app
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-demo1234}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-not-a-real-secret}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/healthz').read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  cua:
    build:
      context: .
      target: cua
    container_name: cua-runtime
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:5000
      APP_USER: ${APP_USER:-svc_agent}
      APP_PASSWORD: ${APP_PASSWORD:-demo1234}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DISPLAY_NUM: "99"
      SCREEN_GEOMETRY: 1280x900x24
      ENABLE_VNC: "1"
    ports:
      # 8080 operator console. 6080 is the view-only VNC bridge the console
      # embeds by default; 6081 is the interactive one it swaps to once the
      # lease has actually transferred to a person.
      - "8080:8080"
      - "6080:6080"
      - "6081:6081"
    volumes:
      - ./src:/work/src:ro
      - ./tests:/work/tests:ro
      - ./scripts:/work/scripts:ro
      - ./artifacts:/work/artifacts
      - ./evidence:/work/evidence
    init: true
    command: ["sleep", "infinity"]

  # `make test`. Behind a profile so `docker compose up` never starts it.
  # Sources are bind-mounted so the suite reruns without a rebuild.
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      APP_URL: http://app:5000
      APP_PASSWORD: ${APP_PASSWORD:-demo1234}
    volumes:
      - ./src:/work/src:ro
      - ./tests:/work/tests:ro
      - ./apps:/work/apps:ro
      - ./artifacts:/work/artifacts:ro
